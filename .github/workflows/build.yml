name: Build

# Builds every game (all its step projects and content), and checks that the games stay
# consistent (tools/check.py). Game folders are found automatically: 01-pong, 02-flappy, …

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.games.outputs.games }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/check.py
      - id: games
        run: echo "games=$(ls -d [0-9][0-9]-*/ | tr -d / | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    # Windows, because some fonts (e.g. Arial) come from the system.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJson(needs.check.outputs.games) }}
    name: build (${{ matrix.game }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ${{ matrix.game }}
